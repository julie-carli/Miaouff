{% extends 'base.html' %}

{% block title %}Mot de passe oublié — Miaouff{% endblock %}

{% block content %}

<div class="login-page">
    <div class="login-card">

        <div class="login-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Miaouff">
        </div>

        <h1 class="login-title">Mot de passe oublié</h1>
        <p class="reset-hint">
            Entrez votre adresse e-mail. Si elle est associée à un compte,
            vous recevrez un lien pour réinitialiser votre mot de passe.
        </p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="login-field">
                <label for="reset-email">Adresse e-mail</label>
                <input type="email" id="reset-email" name="email"
                       class="login-input" placeholder="vous@exemple.fr" required>
            </div>

            <button type="submit" class="login-btn">Envoyer le lien</button>
        </form>

        <p class="login-switch">
            <a href="{{ url_for('auth.login') }}">← Retour à la connexion</a>
        </p>

    </div>
</div>

{% endblock %}
