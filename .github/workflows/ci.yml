# CI pipeline: quality, security and tests.
# Triggered on every push and pull request to the main branch.
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality, security & tests
    runs-on: ubuntu-latest

    env:
      # Injected from GitHub Secrets (never hardcode credentials).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      # A secret key is required for CSRF and signed tokens (test value only).
      SECRET_KEY: "ci-test-secret-key"
      # Disable the Secure cookie flag so the test client (HTTP) keeps sessions.
      SESSION_COOKIE_SECURE: "False"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (prod + dev tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting (black & isort)
        run: |
          black --check .
          isort --check-only .

      - name: Lint with flake8
        run: |
          # Fail on critical errors (syntax, undefined names, etc.).
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Report style/complexity without failing the build.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Security static analysis (bandit)
        run: bandit -r . -x ./venv,./tests,./migrations,./flask_session -ll

      - name: Run tests with coverage
        run: |
          pytest --cov=blueprints --cov=services --cov=factory --cov=extensions \
                 --cov=config --cov-report=xml --cov-report=term-missing \
                 --cov-fail-under=40 -v

      # Dependency vulnerability watch. Non-blocking: advisories appear
      # constantly and some have no released fix yet, but we keep them visible.
      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: pip-audit || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
